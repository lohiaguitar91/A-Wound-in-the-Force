<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070d" />
    <meta name="description" content="A mobile-first interactive atlas of the Star Wars galaxy (Legends continuity): scrub through history, watch territory shift, and flip pivotal events. Personal fan project." />
    <title>Galaxy Atlas</title>
    <link rel="preload" href="./data/atlas.json" as="fetch" crossorigin="anonymous" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2306070d'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e9d8a6'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5' fill='none' stroke='%237aa2f7' stroke-width='1.5' transform='rotate(-25 16 16)'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#scrubber">Skip to time controls</a>
    <div id="app" class="app" data-mode="history">
      <canvas id="map" class="map" role="img" aria-label="Galaxy map, loading" tabindex="0"></canvas>
      <canvas id="map-fx" class="map map-fx" aria-hidden="true"></canvas>

      <header class="topbar">
        <div class="brand">
          <h1 class="title">Galaxy Atlas</h1>
          <p class="subtitle" id="era-readout" aria-live="off">Legends continuity</p>
        </div>
        <nav class="actions" aria-label="Atlas tools">
          <button type="button" class="icon-btn" id="btn-search" aria-label="Find a system or event" title="Find">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-whatif" aria-label="What-if pivots" aria-pressed="false" title="What if">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6l4 6-4 6H4"/><path d="M14 6h6"/><path d="M14 18h6"/><path d="M17 3l3 3-3 3"/><path d="M17 15l3 3-3 3"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-about" aria-label="About this atlas" title="About">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>
          </button>
        </nav>
      </header>

      <div class="hud">
        <div id="legend" class="legend" aria-label="Factions on the map at this time" role="list"></div>
        <button type="button" id="whatif-banner" class="banner" hidden></button>
      </div>

      <div class="zoom-controls" aria-label="Zoom">
        <button type="button" class="icon-btn" id="btn-zoom-in" aria-label="Zoom in">+</button>
        <button type="button" class="icon-btn" id="btn-zoom-out" aria-label="Zoom out">−</button>
        <button type="button" class="icon-btn" id="btn-zoom-fit" aria-label="Fit whole galaxy">⌂</button>
      </div>

      <footer class="scrubber" id="scrubber">
        <div class="scrubber-top">
          <button type="button" class="icon-btn play" id="btn-play" aria-label="Play through time" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play"><path d="M7 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/></svg>
          </button>
          <div class="time-readout">
            <output id="time-readout" for="time" class="year">Loading…</output>
            <span id="events-now" class="events-now" role="status"></span>
          </div>
          <button type="button" class="icon-btn" id="btn-events" aria-label="Events near this time">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
          </button>
        </div>
        <div class="track-wrap">
          <div id="era-ticks" class="era-ticks" aria-hidden="true"></div>
          <input type="range" id="time" class="track" min="0" max="10000" step="1" value="0" aria-label="Time" aria-describedby="era-readout" />
        </div>
      </footer>

      <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="sheet-header">
          <h2 id="sheet-title" class="sheet-title">Details</h2>
          <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
        </header>
        <div class="sheet-body" id="sheet-body"></div>
      </section>

      <div id="live" class="sr-only" aria-live="polite"></div>
      <p class="disclaimer">Fan project. Not affiliated with Lucasfilm, Disney, or Fandom.</p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
